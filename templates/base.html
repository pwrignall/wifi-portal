<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WiFi{% endblock %} - Microsoft Internet Explorer</title>
  <style>
    @keyframes blink { 0%, 100% { visibility: visible; } 50% { visibility: hidden; } }

    body {
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      background-color: #008080;
      margin: 0;
      padding: 8px;
      color: #000;
      min-height: 100vh;
    }

    a { color: #0000ff; }
    a:visited { color: #800080; }

    .marquee-bar {
      background: #000080;
      color: #ffff00;
      font-size: 13px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      padding: 3px 0;
    }

    .window {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      max-width: 480px;
      margin: 10px auto;
    }
    .window-wide { max-width: 740px; }

    .title-bar {
      background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
      color: #fff;
      padding: 3px 6px;
      font-size: 12px;
      font-family: Tahoma, Arial, sans-serif;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title-btns { display: flex; gap: 2px; }
    .tbtn {
      background: #c0c0c0;
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      color: #000;
      width: 16px;
      height: 14px;
      font-size: 9px;
      font-family: Arial, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .menu-bar {
      background: #c0c0c0;
      padding: 1px 4px;
      font-size: 12px;
      font-family: Tahoma, Arial, sans-serif;
      border-bottom: 1px solid #808080;
    }
    .menu-bar .menu-item {
      padding: 2px 6px;
      cursor: default;
      display: inline-block;
    }
    .menu-bar .menu-item:hover { background: #000080; color: #fff; }

    .window-body { padding: 12px 16px; background: #c0c0c0; }

    .status-bar {
      background: #c0c0c0;
      border-top: 1px solid #808080;
      padding: 1px 4px;
      font-size: 11px;
      font-family: Arial, sans-serif;
      display: flex;
      gap: 2px;
    }
    .status-panel {
      border: 1px inset #c0c0c0;
      padding: 0 6px;
    }
    .status-panel:first-child { flex: 1; }

    h1 {
      font-size: 15px;
      color: #000080;
      margin-bottom: 8px;
      font-family: Tahoma, Arial, sans-serif;
      font-weight: bold;
    }
    h2 {
      font-size: 13px;
      color: #000080;
      margin: 14px 0 6px;
      font-family: Tahoma, Arial, sans-serif;
      background: #d4d0c8;
      padding: 2px 6px;
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
    }
    p {
      font-size: 12px;
      margin-bottom: 8px;
      font-family: Arial, sans-serif;
      line-height: 1.4;
    }

    .ssid {
      display: inline-block;
      background: #000080;
      color: #ffffff;
      padding: 1px 8px;
      font-size: 13px;
      font-weight: bold;
      font-family: Tahoma, Arial, sans-serif;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 2px 4px;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      background: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    input:focus { outline: 1px dotted #000080; }

    .btn {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      padding: 4px 16px;
      font-size: 12px;
      font-family: Tahoma, Arial, sans-serif;
      cursor: pointer;
      color: #000000;
      text-decoration: none;
      display: inline-block;
      min-width: 75px;
      text-align: center;
    }
    .btn:active {
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
    }
    .btn:hover { background: #d4d0c8; }
    .btn-primary { font-weight: bold; }
    .btn-danger { color: #800000; }
    .btn-sm { padding: 2px 8px; font-size: 11px; min-width: 50px; }
    .btn-outline { background: #c0c0c0; }

    .error {
      background: #ffcccc;
      border-top: 1px solid #ff0000;
      border-left: 1px solid #ff0000;
      border-right: 1px solid #800000;
      border-bottom: 1px solid #800000;
      color: #800000;
      padding: 4px 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .success-icon {
      font-size: 2rem;
      display: block;
      text-align: center;
      margin-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }
    th {
      background: #000080;
      color: #ffffff;
      padding: 3px 6px;
      text-align: left;
      font-weight: bold;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 11px;
    }
    td { padding: 2px 6px; border-bottom: 1px solid #d4d0c8; }
    tr:nth-child(even) td { background: #ece9d8; }

    code { font-family: "Courier New", monospace; font-size: 12px; }

    .password-display {
      font-size: 1.3rem;
      font-weight: bold;
      color: #000080;
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 6px 10px;
      margin: 4px 0 6px;
      font-family: "Courier New", monospace;
    }
    .meta { font-size: 10px; color: #808080; margin-bottom: 12px; font-family: Arial, sans-serif; }
    .divider {
      border: none;
      border-top: 1px solid #808080;
      border-bottom: 1px solid #ffffff;
      margin: 10px 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    form { margin: 0; }
    .inline-form { display: inline; }
    .row { display: flex; gap: 4px; align-items: flex-start; flex-wrap: wrap; }
    .row input { margin-bottom: 0; flex: 1; min-width: 120px; }

    .badge {
      display: inline-block;
      padding: 1px 4px;
      font-size: 10px;
      border: 1px solid #808080;
      font-family: Arial, sans-serif;
    }
    .badge-iot { background: #ccccff; color: #000080; }
    .badge-guest { background: #ccffcc; color: #006400; }

    .blink { animation: blink 1s step-start infinite; }

    .page-footer {
      text-align: center;
      font-size: 11px;
      color: #c0ffc0;
      margin-top: 6px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <marquee behavior="scroll" direction="left" scrollamount="3" class="marquee-bar">
    &nbsp;&nbsp;&nbsp;
    *** WELCOME TO THE WIFI PORTAL ***
    &nbsp;&nbsp;&#9733;&nbsp;&nbsp;
    CONNECTING YOU TO THE INFORMATION SUPERHIGHWAY
    &nbsp;&nbsp;&#9733;&nbsp;&nbsp;
    PLEASE HAVE YOUR PASSWORD READY
    &nbsp;&nbsp;&#9733;&nbsp;&nbsp;
    NO UNAUTHORIZED ACCESS PERMITTED
    &nbsp;&nbsp;&nbsp;
  </marquee>

  {% block body %}{% endblock %}

  <div class="page-footer">
    <span class="blink">&#10022;</span>
    Best viewed in Internet Explorer 6.0 at 800&#215;600 resolution
    <span class="blink">&#10022;</span>
    &nbsp;|&nbsp; You are visitor #<strong>000042</strong>
  </div>

</body>
</html>
