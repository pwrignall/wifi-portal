<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WiFi{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #1a1a2e;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2rem 2rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .card-wide { max-width: 720px; }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    h2 { font-size: 1.15rem; font-weight: 600; margin: 1.5rem 0 0.75rem; }
    p  { color: #555; line-height: 1.5; margin-bottom: 0.75rem; }

    .ssid {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 6px;
      padding: 0.1rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 0.75rem;
    }
    input:focus { border-color: #4338ca; }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #4338ca; color: #fff; width: 100%; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-sm      { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #d1d5db;
      color: #555;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #b91c1c;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; }
    th { font-weight: 600; color: #555; border-bottom: 2px solid #e5e7eb; }
    tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-iot  { background: #dbeafe; color: #1d4ed8; }
    .badge-guest { background: #d1fae5; color: #065f46; }

    .password-display {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1a1a2e;
      background: #f0f2f5;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      margin: 0.5rem 0 0.25rem;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .meta { font-size: 0.8rem; color: #9ca3af; margin-bottom: 1.5rem; }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 1.75rem 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    form { margin: 0; }

    .inline-form { display: inline; }

    .row { display: flex; gap: 0.5rem; align-items: flex-start; flex-wrap: wrap; }
    .row input { margin-bottom: 0; flex: 1; min-width: 140px; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
