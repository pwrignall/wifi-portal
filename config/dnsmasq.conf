# dnsmasq configuration — generated by setup.sh
# Provides DHCP and DNS for the guest/IoT WiFi network only.

# Serve only on the guest WiFi interface — never the home LAN interface.
interface=wlan0
bind-interfaces

# DHCP pool: hand out addresses in the guest subnet.
# The Pi (gateway) holds .1; clients get .100–.200.
dhcp-range=192.168.100.100,192.168.100.200,255.255.255.0,24h

# Default gateway and DNS for clients point at the Pi itself.
dhcp-option=3,192.168.100.1   # gateway
dhcp-option=6,192.168.100.1   # DNS

# Forward all DNS queries to your home router / upstream DNS.
# Replace with your home router's IP if different.
server=8.8.8.8
server=1.1.1.1

# Redirect all DNS queries to ourselves — this is what triggers the
# captive portal detection on iOS/Android (they see unexpected responses
# and open the mini-browser to show the portal).
address=/#/192.168.100.1

# Do not use /etc/hosts or /etc/resolv.conf from the Pi itself.
no-hosts
no-resolv

# Log DHCP leases for debugging
log-dhcp
