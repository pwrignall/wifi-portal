# hostapd configuration — generated by setup.sh
# Adjust channel/country_code/hw_mode to match your regulatory domain.

interface=wlan0
driver=nl80211

# SSID that guests and IoT devices will see
ssid=HomeGuest

# 2.4 GHz band, 802.11n
hw_mode=g
ieee80211n=1
channel=6

# Open network — no WiFi password (authentication is handled by the captive portal)
auth_algs=1
wpa=0

# Regulatory country code — set to your country (e.g. GB, US, DE)
country_code=GB

# Increase beacon interval slightly to reduce congestion
beacon_int=100
dtim_period=2
